name: Creative Harness decision failure DEVELOPMENT
on:
  pull_request:
    paths:
      - decision_failure_component_tests/**
      - contracts/decision-failure-producer-pins.json
      - docs/decision-failure-component-development.md
      - .github/workflows/decision-failure-component.yml
      - fulfillment_component_tests/custody.mjs
      - fulfillment_component_tests/files.mjs
      - fulfillment_component_tests/process.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intercepted-decision-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Jevelopers-neatHack-2026/agent-harness
          ref: ee86ce2f5917a961a0903591eb13523cf899e54f
          path: reports/runs/decision-harness
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Jevelopers-neatHack-2026/creative-engine
          ref: 46766f97172af679f533d75106d7665a873e8b96
          path: reports/runs/decision-creative
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Build exact private dependency graph and verify intercepted decision boundaries
        shell: bash
        run: |
          env -i PATH="$PATH" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            node decision_failure_component_tests/run.mjs "$PWD/reports/runs/decision-harness" \
              "$PWD/reports/runs/decision-creative" "$PWD/reports/runs/decision-failure-component"
      - name: Preserve sanitized development evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: decision-failure-component-development-${{ github.sha }}
          path: |
            reports/runs/decision-failure-component/*.json
            reports/runs/decision-failure-component/*.tap
            reports/runs/decision-failure-component/controls/*.json
          if-no-files-found: error
          retention-days: 30
