name: PDF-derived evidence persistence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pdf-derived-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - name: Install the locked host TypeScript compiler
        run: node tools/install-typescript-host.mjs
      - name: Run actual isolated PDF reader to durable-store integration
        run: make verify CASE=pdf-derived-evidence MODE=linux-integration
      - name: Typecheck project and evidence consumer fixtures
        run: npm run typecheck
