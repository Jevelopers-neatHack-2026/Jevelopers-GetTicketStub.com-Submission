name: EI JEV question registry

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  question-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - name: Install the locked host TypeScript compiler
        run: node tools/install-typescript-host.mjs
      - name: Type-check project declarations
        run: npm run typecheck
      - name: Test the EI JEV question registry and preparation
        run: node --test tests/decisions/questions/*.test.mjs
      - name: Type-check strict question consumer
        run: ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --types node --typeRoots node_modules/@types tests/decisions/questions/types-consumer.mts
