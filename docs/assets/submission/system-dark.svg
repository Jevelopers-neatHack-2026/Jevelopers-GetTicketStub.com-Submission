<style>text{font-family:'Inter Tight',Arial,sans-serif;fill:#F4ECDD}.title{font-family:Fraunces,Georgia,serif;font-size:34px;font-weight:600}.label{font-size:28px;font-weight:600}.note{font-size:20px}</style>
