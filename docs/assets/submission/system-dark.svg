<text x="30" y="52" class="title" >Inside the customer app</text><rect x="30" y="85" width="620" height="100" rx="14" fill="#26302A" stroke="#F4ECDD" stroke-opacity=".2"/><text x="52" y="124" class="label" >Event input</text><text x="52" y="158" class="note" >A public link or a sample.</text><path d="M340 190v27" stroke="#F4ECDD" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="225" width="620" height="100" rx="14" fill="#26302A" stroke="#F4ECDD" stroke-opacity=".2"/><text x="52" y="264" class="label" >Studio</text><text x="52" y="298" class="note" >Check facts and choose a style.</text><path d="M340 330v27" stroke="#F4ECDD" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="365" width="620" height="100" rx="14" fill="#26302A" stroke="#F4ECDD" stroke-opacity=".2"/><text x="52" y="404" class="label" >Server routes</text><text x="52" y="438" class="note" >Handle research, art, and replies.</text><path d="M340 470v27" stroke="#F4ECDD" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="505" width="620" height="100" rx="14" fill="#26302A" stroke="#F4ECDD" stroke-opacity=".2"/><text x="52" y="544" class="label" >Pages + model providers</text><text x="52" y="578" class="note" >Live mode only; samples in the demo.</text><path d="M340 610v27" stroke="#F4ECDD" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="645" width="620" height="100" rx="14" fill="#26302A" stroke="#F4ECDD" stroke-opacity=".2"/><text x="52" y="684" class="label" >Digital keepsake</text><text x="52" y="718" class="note" >Return to the studio to save or download.</text><text x="30" y="804" class="note" >Source structure; a full live run is not verified.</text></svg>
