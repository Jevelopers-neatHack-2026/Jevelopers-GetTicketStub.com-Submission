<text x="30" y="52" class="title" >Three tools. Three clear jobs.</text><rect x="24" y="90" width="632" height="172" rx="14" fill="#FFF9EF" stroke="#17140F" stroke-opacity=".2"/><text x="48" y="129" class="label" >neatlogs</text><text x="48" y="166" class="label" >See the run</text><text x="48" y="203" class="note" >Steps, errors, and model calls.</text><text x="48" y="236" class="note" >Proof: four trace screenshots.</text><rect x="24" y="285" width="632" height="172" rx="14" fill="#FFF9EF" stroke="#17140F" stroke-opacity=".2"/><text x="48" y="324" class="label" >Entire</text><text x="48" y="361" class="label" >Understand the code</text><text x="48" y="398" class="note" >Map files and their links.</text><text x="48" y="431" class="note" >Proof: public graph output.</text><rect x="450" y="301" width="174" height="52" rx="8" fill="#17140F"/><image x="468" y="313" width="138" height="27" xlink:href="data:image/svg+xml;base64,"/><rect x="24" y="480" width="632" height="172" rx="14" fill="#FFF9EF" stroke="#17140F" stroke-opacity=".2"/><text x="48" y="519" class="label" >cfo.ai</text><text x="48" y="556" class="label" >Plan the business</text><text x="48" y="593" class="note" >Prices, costs, and funding needs.</text><text x="48" y="626" class="note" >Proof: plan and forecast workbook.</text><rect x="450" y="496" width="174" height="52" rx="8" fill="#17140F"/><image x="468" y="508" width="138" height="27" xlink:href="data:image/svg+xml;base64,"/><text x="30" y="710" class="note" >Scope and limits are in the evidence guide.</text></svg>
