name: private source-to-identity composition

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - name: Install the locked host TypeScript compiler
        run: node tools/install-typescript-host.mjs
      - name: Test private source-to-identity composition
        run: node --test tests/discovery/source-identity/*.test.mjs
      - name: Test extraction, evidence, and existing identity primitives
        run: node --test tests/extraction/*.test.mjs tests/evidence/*.test.mjs tests/discovery/identity/*.test.mjs
      - name: Type-check project declarations
        run: npm run typecheck
      - name: Type-check strict source-identity consumer
        run: >-
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext
          --moduleResolution NodeNext --lib ES2022,DOM --types node --typeRoots node_modules/@types
          --skipLibCheck false tests/discovery/source-identity/types-consumer.mts
      - run: make verify CASE=deterministic-extraction MODE=mock
      - run: make verify CASE=evidence-facts MODE=mock
