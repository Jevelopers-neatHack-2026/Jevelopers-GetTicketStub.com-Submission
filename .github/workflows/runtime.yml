name: runtime
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PP_RENDERER_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:bc72a8df40831ded821e3cbc79c318c21b44d6e51dff9fd89ace7a8249c5b462
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install exact dependencies and verified Node archive
        run: docker run --rm --platform linux/amd64 --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --security-opt apparmor=docker-default -e HOME=/tmp -v "$PWD:/work" -w /work "$PP_RENDERER_IMAGE" bash scripts/ci-install.sh
      - name: Verify with operating-system networking disabled
        run: out/toolchain/node-v24.21.0-linux-x64/bin/node scripts/security/run-offline.mjs
