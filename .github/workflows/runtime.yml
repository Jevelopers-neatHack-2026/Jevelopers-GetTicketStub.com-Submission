name: runtime
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PP_RENDERER_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:bc72a8df40831ded821e3cbc79c318c21b44d6e51dff9fd89ace7a8249c5b462
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install exact dependencies and verified Node archive
        run: docker run --rm --platform linux/amd64 -v "$PWD:/work" -w /work "$PP_RENDERER_IMAGE" bash scripts/ci-install.sh
      - name: Verify with operating-system networking disabled
        run: docker run --rm --platform linux/amd64 --network none --ipc host -e PP_RENDERER_IMAGE -e TZ=UTC -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright -v "$PWD:/work" -w /work "$PP_RENDERER_IMAGE" bash scripts/ci-offline.sh
