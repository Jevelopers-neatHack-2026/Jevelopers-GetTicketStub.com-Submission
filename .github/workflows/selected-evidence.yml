name: selected-evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selected-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - name: Install the locked host TypeScript compiler
        run: node tools/install-typescript-host.mjs
      - name: Test evidence store and provenance adapter
        run: node --test tests/evidence/*.test.mjs
      - name: Test extraction and identity consumers
        run: node --test tests/extraction/*.test.mjs tests/discovery/identity/*.test.mjs
      - run: make verify CASE=evidence-facts MODE=mock
      - run: make verify CASE=deterministic-extraction MODE=mock
      - run: npm run typecheck
