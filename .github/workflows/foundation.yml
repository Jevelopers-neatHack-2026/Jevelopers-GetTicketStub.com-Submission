name: Shared contract foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Provision locked dependency cache
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify offline implemented candidates
        env:
          npm_config_offline: 'true'
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
          npm run contracts:check -- --implemented
          npm run contracts:fixtures -- --implemented
          npm run contracts:compat -- --implemented
          npm run contracts:inventory -- --require-consumer --require-leaf --require-version-policy
          npm run contracts:inventory -- --require-field-classification --policy-only
          npm run docs:check
          npm run generate -- --check
          git diff --exit-code -- schemas generated fixtures
          npm run test:installed
          npm pack --dry-run
