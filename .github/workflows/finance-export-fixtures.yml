name: Finance export captured fixture consumer
on:
  pull_request:
    paths:
      - finance_component_tests/export-candidate.mjs
      - finance_component_tests/export-candidate.test.mjs
      - finance_component_tests/fixtures/export0c4/**
      - finance_component_tests/fixture-schema.mjs
      - finance_component_tests/candidate924.mjs
      - finance_component_tests/custody.mjs
      - finance_component_tests/receipt.mjs
      - finance_component_tests/run.mjs
      - contracts/finance-export0c4-fixture-pin.json
      - contracts/finance924-fixture-pin.json
      - .github/workflows/finance-export-fixtures.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  captured-export-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Verify export projection and preserved receipt guards without networking
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/finance-export-temp"
          sudo -n unshare --net -- runuser -u "$(id -un)" -- env -i PATH="$PATH" TMPDIR="$RUNNER_TEMP/finance-export-temp" \
            node --test finance_component_tests/export-candidate.test.mjs finance_component_tests/candidate924.test.mjs finance_component_tests/receipt.test.mjs \
            > "$RUNNER_TEMP/finance-export-tests.tap" 2>&1
      - name: Record qualified captured export consumer ACK
        shell: bash
        run: |
          sudo -n unshare --net -- runuser -u "$(id -un)" -- env -i PATH="$PATH" TMPDIR="$RUNNER_TEMP/finance-export-temp" \
            node finance_component_tests/run.mjs --candidate-export0c4-fixtures "$RUNNER_TEMP/finance-export-consumer"
      - name: Preserve captured projection and custody evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finance-export-captured-consumer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/finance-export-tests.tap
            ${{ runner.temp }}/finance-export-consumer/**
          if-no-files-found: error
          retention-days: 30
