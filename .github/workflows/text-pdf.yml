name: bounded text PDF reader

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  text-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - name: Install the locked host TypeScript compiler
        run: node tools/install-typescript-host.mjs
      - run: node --test tests/extraction/pdf/reader.test.mjs
      - run: node --test tests/extraction/deterministic-extraction.test.mjs
      - run: >-
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022
          --module NodeNext --moduleResolution NodeNext --lib ES2022,DOM
          --types node tests/extraction/pdf/types-consumer.mts
      - run: npm run typecheck
