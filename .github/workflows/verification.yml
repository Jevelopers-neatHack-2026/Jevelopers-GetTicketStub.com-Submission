name: Verification tooling
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.4
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run basedpyright
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run integration-evals validate
      - run: uv run pytest --junitxml=reports/tooling-junit.xml
      - name: Verify missing assembly is reported as blocked
        shell: bash
        run: |
          set +e
          uv run integration-evals run --output reports/runs
          status=$?
          set -e
          test "$status" -eq 2
      - name: Preserve sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-tooling-${{ github.sha }}
          path: reports/
          retention-days: 30
