name: Verification tooling
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.4
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run basedpyright
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run integration-evals validate
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Jevelopers-neatHack-2026/shared-contracts
          ref: 2af72ecb86437ee7b4271ff6c2ef08b89c4296a2
          path: .contract-producer
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Install platform isolation tooling
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Verify real Linux isolation and retained owner output
        run: |
          mkdir -p reports
          sudo -n .venv/bin/python -m pytest tests/test_owner_output.py tests/test_processes.py -o cache_dir="${RUNNER_TEMP}/integration-evals-root-cache" --junitxml=reports/linux-owner-junit.xml
      - run: uv run pytest --ignore=tests/test_owner_output.py --ignore=tests/test_processes.py --junitxml=reports/tooling-junit.xml
      - name: Verify complete canonical scope and controlled failures
        shell: bash
        run: |
          uv run integration-evals contract-runtime --node "$(command -v node)" --output reports/node-runtime.json
          mkdir -p reports/runs/contracts
          sudo -n env IE_CONTRACT_SOURCE="$PWD/.contract-producer" IE_CONTRACT_RUNTIME="$PWD/reports/node-runtime.json" .venv/bin/python -m pytest integration_tests -o cache_dir="${RUNNER_TEMP}/integration-evals-canonical-cache" --junitxml=reports/canonical-junit.xml
          sudo -n .venv/bin/integration-evals contracts --pin contracts/producer-pin.json --producer .contract-producer --runtime reports/node-runtime.json --output reports/runs/contracts --candidate-scope
          sudo -n .venv/bin/integration-evals contracts --pin contracts/producer-pin.json --producer .contract-producer --runtime reports/node-runtime.json --output reports/runs/contracts
      - name: Verify missing assembly is reported as blocked
        shell: bash
        run: |
          set +e
          uv run integration-evals run --output reports/runs
          status=$?
          set -e
          test "$status" -eq 2
      - name: Preserve sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-tooling-${{ github.sha }}
          path: reports/
          retention-days: 30
