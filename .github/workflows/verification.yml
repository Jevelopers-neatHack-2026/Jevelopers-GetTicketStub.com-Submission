name: Verification tooling
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.4
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run basedpyright
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run basedpyright -p pyrightconfig.stdlib.json
      - run: uv run ruff check --config ruff-stdlib.toml tools tests/test_audit_evidence.py tests/test_rerun_report.py
      - run: uv run integration-evals validate
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Jevelopers-neatHack-2026/shared-contracts
          ref: d432ad5c895a67155affeaa05cd8423c758d95c3
          path: .contract-producer
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Reproduce and privately install the reviewed package
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/contract-packager" --ignore-scripts --no-audit --no-fund npm@10.9.8
          export PATH="$RUNNER_TEMP/contract-packager/node_modules/.bin:$PATH"
          mkdir -p reports
          node integration_tests/prepare-package.mjs .contract-producer "$RUNNER_TEMP/contract-runtime" > reports/private-install.json
          npm install --prefix "$RUNNER_TEMP/contract-types" --ignore-scripts --no-audit --no-fund typescript@5.9.3
          cp integration_tests/installed-caller.mts integration_tests/installed-scenarios.mjs "$RUNNER_TEMP/contract-runtime/"
          node "$RUNNER_TEMP/contract-types/node_modules/typescript/bin/tsc" --strict --noUncheckedIndexedAccess --exactOptionalPropertyTypes --verbatimModuleSyntax --noFallthroughCasesInSwitch --noPropertyAccessFromIndexSignature --skipLibCheck false --module NodeNext --moduleResolution NodeNext --target ES2022 "$RUNNER_TEMP/contract-runtime/installed-caller.mts"
          node "$RUNNER_TEMP/contract-runtime/installed-scenarios.mjs" > reports/installed-caller.json
      - name: Install platform isolation tooling
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Verify real Linux isolation and retained owner output
        run: |
          mkdir -p reports
          sudo -n .venv/bin/python -m pytest tests/test_owner_output.py tests/test_processes.py tests/test_retrieval_capability.py -o cache_dir="${RUNNER_TEMP}/integration-evals-root-cache" --junitxml=reports/linux-owner-junit.xml
      - run: uv run pytest --ignore=tests/test_owner_output.py --ignore=tests/test_processes.py --ignore=tests/test_retrieval_capability.py --junitxml=reports/tooling-junit.xml
      - name: Verify complete canonical scope and controlled failures
        shell: bash
        run: |
          uv run integration-evals contract-runtime --node "$(command -v node)" --output reports/node-runtime.json
          mkdir -p reports/runs/contracts
          sudo -n env IE_CONTRACT_SOURCE="$PWD/.contract-producer" IE_CONTRACT_RUNTIME="$PWD/reports/node-runtime.json" IE_CONTRACT_INSTALLED_RUNTIME="$RUNNER_TEMP/contract-runtime/installed-runtime.json" IE_CONTRACT_CALLER_ROOT="$RUNNER_TEMP/contract-runtime" IE_CONTRACT_TYPESCRIPT="$RUNNER_TEMP/contract-types/node_modules/typescript/bin/tsc" IE_CONTRACT_EVIDENCE="$PWD/reports/installed-negatives" .venv/bin/python -m pytest integration_tests -o cache_dir="${RUNNER_TEMP}/integration-evals-canonical-cache" --junitxml=reports/canonical-junit.xml
          sudo -n .venv/bin/integration-evals contracts --pin contracts/producer-pin.json --producer .contract-producer --runtime reports/node-runtime.json --output reports/runs/contracts --candidate-scope
          sudo -n .venv/bin/integration-evals contracts --pin contracts/producer-pin.json --producer .contract-producer --runtime reports/node-runtime.json --output reports/runs/contracts
          sudo -n .venv/bin/integration-evals contracts --pin contracts/producer-pin.json --producer .contract-producer --runtime "$RUNNER_TEMP/contract-runtime/installed-runtime.json" --output reports/runs/contracts --candidate-scope
          sudo -n .venv/bin/integration-evals contracts --pin contracts/producer-pin.json --producer .contract-producer --runtime "$RUNNER_TEMP/contract-runtime/installed-runtime.json" --output reports/runs/contracts
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Jevelopers-neatHack-2026/event-intelligence
          ref: d91e08d666abc243ae456a7f9f1bc9c745ca4f8d
          path: .event-producer
          persist-credentials: false
      - name: Verify source retrieval boundary in an isolated Linux component workspace
        run: |
          sudo -n env IE_EVENT_SOURCE="$PWD/.event-producer" IE_CONTRACT_SOURCE="$PWD/.contract-producer" IE_CONTRACT_RUNTIME="$PWD/reports/node-runtime.json" IE_COMPONENT_EVIDENCE="$PWD/reports/retrieval-component" .venv/bin/python -m pytest component_tests -o cache_dir="${RUNNER_TEMP}/integration-evals-component-cache" --junitxml=reports/component-junit.xml
      - name: Verify missing assembly is reported as blocked
        shell: bash
        run: |
          set +e
          uv run integration-evals run --output reports/runs
          status=$?
          set -e
          test "$status" -eq 2
      - name: Preserve sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-tooling-${{ github.sha }}
          path: reports/
          retention-days: 30
