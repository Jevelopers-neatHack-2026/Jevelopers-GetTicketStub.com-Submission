name: Private asset source discovery

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  asset-source-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - name: Install the locked host TypeScript compiler
        run: node tools/install-typescript-host.mjs
      - name: Run private parser-to-store asset source checks
        run: make verify CASE=asset-source-discovery MODE=mock
      - name: Run actual legacy v1/v2 binary migration through real PDF and v3 writes
        run: make verify CASE=asset-source-discovery-linux MODE=linux-integration
      - name: Typecheck project and asset discovery consumer
        run: npm run typecheck
