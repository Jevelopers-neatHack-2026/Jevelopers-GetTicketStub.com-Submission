name: Entire graph
# Generate the graph only after a trusted main-branch update. Manual dispatch can
# select another ref, whose workflow YAML controls its own permissions, so this
# workflow has no PR or manual-dispatch entry point.
# Generated files are downloadable for maintainer review; this workflow never pushes them.
on:
  push:
    branches: [main]
permissions:
  contents: read
env:
  ENTIRE_VERSION: v0.11.4
  ENTIRE_NO_AUTO_UPDATE: '1'
jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Entire CLI
        run: |
          mkdir -p "$RUNNER_TEMP/entire" "$HOME/.local/bin"
          cd "$RUNNER_TEMP/entire"
          base="https://github.com/entireio/cli/releases/download/$ENTIRE_VERSION"
          curl -fsSLO "$base/entire_linux_amd64.tar.gz"
          curl -fsSLO "$base/checksums.txt"
          grep ' entire_linux_amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf entire_linux_amd64.tar.gz
          install -m 0755 entire git-remote-entire "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install graph plugin
        run: |
          entire version
          entire plugin install graph
          entire graph version --json | tee "$RUNNER_TEMP/graph-version.json"
          entire graph capabilities --json > "$RUNNER_TEMP/graph-capabilities.json"
      - name: Export graph snapshot
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          entire graph snapshot --repo . --format compact-ndjson > "$out/graph-snapshot.ndjson"
          cp "$RUNNER_TEMP/graph-version.json" "$RUNNER_TEMP/graph-capabilities.json" "$out/"
          git rev-parse HEAD > "$out/commit.txt"
          (cd "$out" && sha256sum graph-snapshot.ndjson graph-version.json graph-capabilities.json commit.txt > SHA256SUMS)
          {
            echo "### entire-graph for \`$(git rev-parse HEAD)\`"
            echo "- Entire CLI: \`$ENTIRE_VERSION\`; graph plugin: \`$(tr -d '\n' < "$RUNNER_TEMP/graph-version.json")\`"
            echo "- Snapshot records: $(wc -l < "$out/graph-snapshot.ndjson")"
            echo "- Snapshot SHA-256: \`$(sha256sum "$out/graph-snapshot.ndjson" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate agent instructions
        run: entire graph init-agents --repo .
      - name: Package generated instructions for review
        run: |
          out="$RUNNER_TEMP/out/init-agents"
          mkdir -p "$out/.entire"
          cp .entire/graph-agent.md "$out/.entire/graph-agent.md"
          cp AGENTS.md CLAUDE.md "$out/"
          echo "- Generated instruction candidates are included under init-agents/ for manual review; nothing is pushed." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: entire-graph-${{ github.sha }}
          path: ${{ runner.temp }}/out
          retention-days: 90
