name: EI offline evaluation projection

on:
  push:
    paths:
      - .github/workflows/offline-eval-projection.yml
      - evals/project_results.py
      - tests/evals/test_project_results.py
      - tests/fixtures/evals/project-results/**
      - docs/evals/offline-normalized-results.md
  pull_request:
    paths:
      - .github/workflows/offline-eval-projection.yml
      - evals/project_results.py
      - tests/evals/test_project_results.py
      - tests/fixtures/evals/project-results/**
      - docs/evals/offline-normalized-results.md

permissions:
  contents: read

jobs:
  offline-eval-projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.17'
      - name: Test bounded synthetic-only offline projection
        run: |
          python3 - <<'PY'
          import unittest

          expected = 22
          suite = unittest.defaultTestLoader.discover(
              start_dir="tests/evals",
              pattern="test_project_results.py",
          )
          discovered = suite.countTestCases()
          if discovered != expected:
              raise SystemExit(f"Expected {expected} projector tests, discovered {discovered}")

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (
              result.testsRun != expected
              or not result.wasSuccessful()
              or result.skipped
              or result.expectedFailures
              or result.unexpectedSuccesses
          ):
              raise SystemExit(
                  f"Projector tests incomplete or failed: ran={result.testsRun}, "
                  f"skipped={len(result.skipped)}, failures={len(result.failures)}, "
                  f"errors={len(result.errors)}"
              )
          PY
