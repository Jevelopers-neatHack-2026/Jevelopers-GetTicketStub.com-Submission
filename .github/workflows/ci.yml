name: foundation-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-foundation:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v24.15.0"
          test "$(npm --version)" = "11.12.1"

      - name: Install locked dependencies
        run: npm ci

      - name: Build and run local contract tests
        run: npm test

      - name: Verify the simulated contract wrapper
        run: npm run verify:contract

      - name: Verify the simulated catalog wrapper
        run: npm run verify:catalog

      - name: Verify the offline provider matrix policy
        run: npm run verify:provider-matrix

      - name: Verify private local security policy fixtures
        run: npm run verify:security

      - name: Verify the simulated metering and outbox suite
        run: npm run verify:metering

      - name: Verify the deterministic simulated runtime
        run: npm run verify:mock

      - name: Verify private offline quote fixtures
        run: npm run verify:quote

      - name: Verify private local durable attempt fixtures
        run: npm run verify:attempt-store

      - name: Verify private offline comparison fixtures
        run: npm run verify:comparison

      - name: Verify private offline status fixtures
        run: npm run verify:status

      - name: Verify private simulated Product Details decoder fixtures
        run: npm run verify:prodigi-product-details

      - name: Verify private bounded PNG byte inspection fixtures
        run: npm run verify:png-inspection
