name: evidence-audit

on:
  pull_request:
    paths:
      - "tools/audit_evidence.py"
      - "tests/**"
      - "docs/evidence-audit.md"
      - "planning/acceptance-checklist.*"
      - "evidence/**"
      - ".github/workflows/evidence-audit.yml"
      - ".github/workflows/entire-graph.yml"
  push:
    branches: [main]
    paths:
      - "tools/audit_evidence.py"
      - "tests/**"
      - "docs/evidence-audit.md"
      - "planning/acceptance-checklist.*"
      - "evidence/**"
      - ".github/workflows/evidence-audit.yml"
      - ".github/workflows/entire-graph.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest -v tests.test_audit_evidence tests.test_entire_graph_workflow_security
      - name: Audit evidence integrity
        run: python tools/audit_evidence.py
