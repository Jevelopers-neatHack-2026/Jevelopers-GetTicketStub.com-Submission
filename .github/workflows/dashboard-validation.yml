name: Dashboard validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-validation:
    name: Fixture validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      TZ: UTC
      TD_TEST_PORT: '49177'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare report directories
        run: |
          mkdir -p artifacts/reports artifacts/e2e artifacts/integration
          : > artifacts/commands.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0

      - name: Pin and verify npm
        run: |
          npm install --global npm@11.12.1
          test "$(node --version)" = 'v24.15.0'
          test "$(npm --version)" = '11.12.1'
          printf '%s\n' runtime >> artifacts/commands.txt

      - name: Install locked dependencies
        run: |
          npm ci
          printf '%s\n' npm-ci >> artifacts/commands.txt

      - name: Install Playwright Chromium shell and system dependencies
        run: |
          npx playwright install --with-deps --only-shell chromium
          printf '%s\n' playwright-install >> artifacts/commands.txt

      - name: Lint
        run: |
          npm run lint
          printf '%s\n' lint >> artifacts/commands.txt

      - name: Type check
        run: |
          npm run typecheck
          printf '%s\n' typecheck >> artifacts/commands.txt

      - name: Run Vitest and write JSON report
        run: |
          npm run test -- --run --reporter=json --outputFile=artifacts/reports/vitest.json
          printf '%s\n' vitest >> artifacts/commands.txt

      - name: Build package
        run: |
          npm run build
          printf '%s\n' build >> artifacts/commands.txt

      - name: Check contrast and write JSON report
        run: |
          npm --silent run check:contrast > artifacts/reports/contrast.json
          printf '%s\n' contrast >> artifacts/commands.txt

      - name: Run fixture browser journeys
        env:
          TD_ARTIFACT_DIR: artifacts/e2e
        run: |
          npm run test:e2e -- --forbid-only --fail-on-flaky-tests
          printf '%s\n' e2e >> artifacts/commands.txt

      - name: Run fixture host integration
        env:
          TD_ARTIFACT_DIR: artifacts/integration
        run: |
          npm run test:integration -- --forbid-only --fail-on-flaky-tests
          printf '%s\n' integration >> artifacts/commands.txt

      - name: Test CI report gate rejection cases
        run: |
          node --test scripts/assert-ci-reports.test.mjs
          printf '%s\n' gate-tests >> artifacts/commands.txt

      - name: Validate command log and fixture reports
        if: always()
        run: |
          node scripts/assert-ci-reports.mjs \
            --commands artifacts/commands.txt \
            --vitest artifacts/reports/vitest.json \
            --contrast artifacts/reports/contrast.json \
            --e2e artifacts/e2e/results.json \
            --integration artifacts/integration/results.json

      - name: Upload fixture reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-fixture-reports
          path: |
            artifacts/reports/vitest.json
            artifacts/reports/contrast.json
            artifacts/e2e/results.json
            artifacts/integration/results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload fixture screenshots and traces after failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-fixture-failure-media
          path: |
            artifacts/e2e/**/*.png
            artifacts/e2e/**/*.zip
            artifacts/integration/**/*.png
            artifacts/integration/**/*.zip
          if-no-files-found: ignore
          retention-days: 14
